version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: proctor-postgres
    restart: always
    environment:
      POSTGRES_DB: assessment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: proctor-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proctor-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/assessment_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=supersecretaccesstokengenerator99882211
      - JWT_REFRESH_SECRET=supersecretrefreshtokengenerator11228899
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: proctor-worker
    restart: always
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/assessment_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_URL=http://server:4000
      - JWT_ACCESS_SECRET=supersecretaccesstokengenerator99882211
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: proctor-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres-data:
